<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConRisk 로그인</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand big"><img src="/favicon.svg" alt="" width="36" height="36"> ConRisk</div>
  <p class="muted">건설 현장 리스크 관리 서비스</p>
  <a class="btn primary wide" href="/auth/login" id="google-btn">Google 계정으로 로그인</a>
  <p id="msg" class="msg" hidden></p>
  <p class="small muted">허용된 Google 계정만 들어갈 수 있습니다. 비밀번호는 이 서비스에 저장되지 않으며, 로그인은 Google 화면에서 이루어집니다.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
